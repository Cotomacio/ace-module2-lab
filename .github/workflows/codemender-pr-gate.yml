name: CodeMender PR Delta Gate

# ---------------------------------------------------------------------------
# CodeMender PR Delta Gate — Impact-aware PR delta scanning (CodeMender v0.11.0)
#
# Audits modified pull request hunks and their 1-hop dependency neighbor files
# (callers and callees) while suppressing pre-existing vulnerabilities.
#
# Runs in under 2 minutes without requiring manual file-parking hacks.
# Fails red if new HIGH or CRITICAL vulnerabilities are introduced in the PR.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'lab/**'
      - '.gitignore'

permissions:
  contents: read           # read repo and git history
  id-token: write          # mint GitHub OIDC token for WIF auth
  security-events: write   # publish SARIF alerts to GitHub Security tab

env:
  CLOUD_ML_PROJECT_ID: ${{ vars.GCP_QUOTA_PROJECT }}
  CM_LOCATION: global
  CM_BUNDLED: lab/bin/cm-linux

jobs:
  pr-security-gate:
    name: Delta Security Audit (1-Hop Analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history needed for git diff against base branch

      - name: Check WIF configuration
        run: |
          set -uo pipefail
          MISSING=""
          [ -n "${{ vars.GCP_WIF_PROVIDER }}" ]  || MISSING="$MISSING GCP_WIF_PROVIDER"
          [ -n "${{ vars.GCP_SA_EMAIL }}" ]      || MISSING="$MISSING GCP_SA_EMAIL"
          [ -n "${{ vars.GCP_QUOTA_PROJECT }}" ] || MISSING="$MISSING GCP_QUOTA_PROJECT"
          [ -n "${{ secrets.WIF_AUDIENCE }}" ]   || MISSING="$MISSING WIF_AUDIENCE(Secrets-tab)"
          if [ -n "$MISSING" ]; then
            echo "::error title=Missing WIF configuration::Not set:$MISSING."
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF / ADC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          project_id: ${{ vars.GCP_QUOTA_PROJECT }}
          audience: ${{ secrets.WIF_AUDIENCE }}

      - name: Install CodeMender CLI (cm)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmbin"
          # Check if bundled binary exists and is modern (v0.11.0+)
          if [ -f "$CM_BUNDLED" ] && "$CM_BUNDLED" --version 2>&1 | grep -qE "0\.(1[0-9]|[2-9][0-9])\."; then
            echo "Using bundled modern cm binary ($CM_BUNDLED)"
            install -m 0755 "$CM_BUNDLED" "$RUNNER_TEMP/cmbin/cm"
          else
            echo "Fetching CodeMender v0.11.0 from Google Artifact Registry..."
            gcloud artifacts generic download \
                --project=cmoc-prod \
                --location=us \
                --repository=codemender-cli-production \
                --package=cm \
                --version=0.11.0 \
                --name=cm-linux-amd64.zip \
                --destination="$RUNNER_TEMP"
            unzip -qo "$RUNNER_TEMP/cm-linux-amd64.zip" -d "$RUNNER_TEMP/cmbin"
            chmod +x "$RUNNER_TEMP/cmbin/cm"
          fi
          echo "$RUNNER_TEMP/cmbin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cmbin/cm" --version || true

      - name: Initialize CodeMender Workspace
        run: |
          set -uo pipefail
          cm init || true
          cm init --verify || true

      - name: Run Impact-Aware PR Delta Scan
        id: delta_scan
        run: |
          set -uo pipefail
          echo "Scanning PR delta hunks and 1-hop dependency neighborhood against base branch..."
          # --diff: scans only modified hunks + 1-hop neighbor files, suppressing legacy debt
          # --fail-on HIGH: exits non-zero if any new HIGH or CRITICAL finding is introduced
          # --unrestricted: disables sbox namespace loopback requirements in unprivileged CI runners
          cm find . --diff --fail-on HIGH --unrestricted -y 2>&1 | tee "$RUNNER_TEMP/cm-pr-scan.log"

      - name: Export PR Security SARIF
        if: always()
        run: |
          set -uo pipefail
          cm report -f json > "$RUNNER_TEMP/codemender-pr.json" 2>/dev/null || true
          python3 .github/scripts/cm_to_sarif.py "$RUNNER_TEMP/codemender-pr.json" "$RUNNER_TEMP/codemender-pr.sarif"
          cm report -f text || true

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/codemender-pr.sarif
          category: codemender-pr
        continue-on-error: true
